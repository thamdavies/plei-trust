default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch("DATABASE_USERNAME", "pawnify") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "pawnify_local_only") %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "pawnify_development") %>

test:
  <<: *default
  database: pawnify_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
