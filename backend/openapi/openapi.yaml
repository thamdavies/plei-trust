openapi: 3.1.0
info:
  title: Pawnify API
  version: 1.0.0
  description: Initial health and administrator authentication API.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: System
    description: Application health and readiness.
  - name: Authentication
    description: Sign in and revoke bearer-token sessions.
  - name: Identity
    description: Current authenticated user's identity and permissions.
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check application and database readiness
      security: []
      responses:
        '200':
          description: Application and database are ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: unavailable
  /session:
    post:
      tags: [Authentication]
      operationId: createSession
      summary: Sign in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '201':
          description: Session created; token is returned once
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_at, user]
                properties:
                  access_token:
                    type: string
                  token_type:
                    const: Bearer
                  expires_at:
                    type: string
                    format: date-time
                  user:
                    $ref: '#/components/schemas/Identity'
        '401':
          description: Credentials were rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Required credentials are missing or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Authentication]
      operationId: destroySession
      summary: Revoke the current access token
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked
        '401':
          description: Missing, invalid, expired, or revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentIdentity
      summary: Return the signed-in user's identity and account privilege
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          description: Missing, invalid, expired, or revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Identity:
      type: object
      required: [id, username, account, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: admin
        account:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: Pawnify
        role:
          type: string
          enum: [owner]
        permissions:
          type: array
          description: Effective action-level permission keys for this identity and account context.
          items:
            type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
